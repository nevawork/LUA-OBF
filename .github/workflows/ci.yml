name: nevanex-ci-gate

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  gate0:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm ci || npm install

      # Full gate: tsc -> e2e differential -> vitest (unit+fuzz+phases) ->
      # determinism/isomorphism. Fails the job on ANY red.
      - name: Verify (Gate 0)
        id: verify
        run: |
          set -o pipefail
          bash scripts/verify.sh 2>&1 | tee verify.log
          exit ${PIPESTATUS[0]}

      # Gate-0 report: budgets, entropy, similarity, red-team zero-wins,
      # performance baselines -> rendered into the run summary + artifact.
      - name: Gate-0 report
        if: always()
        run: |
          npx tsc || true
          node scripts/gate0-report.cjs > gate0-summary.md || true
          cat gate0-summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate0-reports
          path: |
            verify.log
            gate0-summary.md
            .gate0/report.json
          if-no-files-found: ignore
